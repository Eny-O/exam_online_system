# 本地开发用中间件：Nacos（注册/配置中心）+ Sentinel Dashboard（流控熔断）
#
#   端口说明（Windows 特有坑）：
#   本机 netsh 显示 TCP 排除端口段 8798-9197（Hyper-V/WSL 动态预留），
#   标准端口 8848 / 8858 正落在该区段内，容器绑定会报
#   "ports are not available ... forbidden by its access permissions"。
#   因此宿主端口统一改到 1xxxx 段。
#
#   Nacos 2.x 客户端规则：gRPC 端口 = HTTP 端口 + 1000
#     宿主 HTTP 18848  → 容器 8848
#     宿主 gRPC 19848  → 容器 9848   (= 18848 + 1000，客户端自动推导，勿改)
#     宿主 gRPC 19849  → 容器 9849   (集群 gRPC，单机也需保留)
#
#   Sentinel Dashboard：容器内 server.port=8858，传输/命令端口 csp.sentinel.api.port=8719
#     宿主 18858 → 容器 8858  (控制台 UI)
#     宿主 18719 → 容器 8719  (客户端心跳/规则下发通道)

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    ports:
      - "18848:8848"   # HTTP：配置/注册端口
      - "19848:9848"   # 客户端 gRPC 端口（Nacos 2.x 必开，= 18848+1000）
      - "19849:9849"   # 集群 gRPC 端口
    environment:
      - MODE=standalone          # 单机模式
      - NACOS_AUTH_ENABLE=false  # 本地 dev 关鉴权
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: sentinel
    ports:
      - "18858:8858"   # Dashboard 控制台 UI
      - "18719:8719"   # 客户端上报通道：Spring 应用连这个端口才能上报心跳/拉取规则
    # 本地 dev 关鉴权（与 Nacos 的 NACOS_AUTH_ENABLE=false 保持一致）：
    #   Dashboard 默认 auth.enabled=true，UI 与 API 都需要登录，
    #   置 false 后走 FakeAuthServiceImpl 直接放行，便于本机配置流控规则。
    #   属性来自 com.alibaba.csp.sentinel.dashboard.config.AuthProperties（prefix="auth"）。
    #   镜像 entrypoint 是写死的 java 命令，不读 JAVA_OPTS，只能整体覆盖。
    entrypoint:
      - java
      - -Djava.security.egd=file:/dev/./urandom
      - -Dserver.port=8858
      - -Dcsp.sentinel.api.port=8719
      - -Dcsp.sentinel.dashboard.server=localhost:8858
      - -Dproject.name=sentinel-dashboard
      - -Dauth.enabled=false
      - -jar
      - app.jar
    restart: unless-stopped

  # ==================== RocketMQ ====================
  # 端口说明：9876 / 10909 / 10911 / 10912 均不在 Windows 保留端口段
  # （保留段为 8798-9197、9201-9400、50000-50059），因此可直接沿用标准端口。
  #
  # 关键：broker.conf 里 brokerIP1=127.0.0.1，宿主机上的 Spring 应用
  #      通过 10911 端口映射回到容器，勿改成容器 IP（172.x.x.x 会连不上）。

  rmqnamesrv:
    image: apache/rocketmq:5.3.2
    container_name: rmqnamesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"    # NameServer：客户端查路由
    environment:
      - JAVA_OPT_EXT=-server -Xms256m -Xmx512m -Xmn128m
    restart: unless-stopped

  rmqbroker:
    image: apache/rocketmq:5.3.2
    container_name: rmqbroker
    depends_on:
      - rmqnamesrv
    # 显式指定配置文件，不依赖官方镜像 entrypoint 的隐式行为
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    ports:
      - "10909:10909"  # VIP 通道
      - "10911:10911"  # 消息收发主端口
      - "10912:10912"  # HA 端口
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      - JAVA_OPT_EXT=-server -Xms512m -Xmx1g -Xmn256m
    volumes:
      # broker.conf 不加 :ro —— broker 启动时会回写自身配置，只读挂载会失败
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
      # 用宿主目录 bind mount，而非 named volume：
      # named volume 新建时属主是 root:root，而镜像以 rocketmq(uid 3000) 运行 → 写不进去 → 启动 NPE
      - ./rocketmq/store:/home/rocketmq/store      # 消息存储：重启不丢
      - ./rocketmq/logs:/home/rocketmq/logs
    restart: unless-stopped

  # ==================== 数据存储层（profile: full）====================
  # 默认 `docker compose up` 只起中间件；`docker compose --profile full up`
  # 额外拉起 MySQL 与 Redis，把数据层也容器化，方便一键起整套依赖。
  #
  # 初始化挂载：官方 MySQL 镜像在首次启动时会按文件名字母序执行
  # /docker-entrypoint-initdb.d/ 下的 *.sql。若直接挂 schema.sql / init-data.sql，
  # 字母序 i < s 会让 init-data 先于 schema 执行而报错。这里把两个源文件以
  # 01-/02- 前缀挂载进容器，既保留仓库内友好文件名，又保证「先建表、后灌数据」。
  #
  # 账号/端口与 exam_auth_user、exam-core 的 datasource 保持一致：
  #   root / 123456，宿主 13306 → 容器 3306（避开本机已装的 3306）。

  mysql:
    image: mysql:8.0.31
    container_name: exam-mysql
    profiles: ["full"]
    ports:
      - "13306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=exam_auth_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/init-data.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: exam-redis
    profiles: ["full"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql_data:
