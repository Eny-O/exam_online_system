# 全容器化一键部署：中间件 + 数据层 + 5 个应用服务
#
# 用法（镜像由 GitHub Actions 推送到 GHCR，别人零构建）：
#   1) （可选）项目根创建 .env，写入：
#        IMAGE_PREFIX=ghcr.io/eny-o
#        AI_API_KEY=你的SiliconFlow密钥
#      不写 IMAGE_PREFIX 时默认用 ghcr.io/eny-o
#   2) docker compose up -d          # compose 会自动拉取各应用镜像
#   3) 浏览器访问 http://localhost:8080 （前端）
#
# 设计要点：
#   - 应用镜像由 GitHub Actions（.github/workflows/build-push.yml）构建并推到
#     GitHub Container Registry（ghcr.io），使用自动注入的 GITHUB_TOKEN，无需任何外部密钥。
#   - 各微服务通过 SPRING_PROFILES_ACTIVE=docker 激活各自的 *-docker.yml，
#     把 localhost 系地址改写为容器服务名（mysql / redis / rmqnamesrv / nacos / sentinel）。
#   - 前端 nginx 把 /api 代理到网关服务名 gateway:8080（保留 /api 前缀，由网关剥离）。
#   - 不依赖 Nacos 配置中心存放配置值（本地 docker profile 文件即配置源），
#     因此克隆下来即可一键启动，无需手动导入配置。
#   - 密码/内key 均沿用仓库内明文默认值（演示用）；生产请改镜像内配置或注入环境变量。
#   - GHCR 镜像默认私有；首次推送后请在 GHCR 包设置里把 5 个镜像改为「Public」，否则他人无法匿名 pull。

services:
  # ==================== 注册/配置中心 ====================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    ports:
      - "18848:8848"   # HTTP：配置/注册端口
      - "19848:9848"   # 客户端 gRPC 端口（Nacos 2.x 必开，= 18848+1000）
      - "19849:9849"   # 集群 gRPC 端口
    environment:
      - MODE=standalone          # 单机模式
      - NACOS_AUTH_ENABLE=false  # 本地 dev 关鉴权
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks: [exam-net]
    restart: unless-stopped

  # ==================== 流控熔断控制台 ====================
  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: sentinel
    ports:
      - "18858:8858"   # Dashboard 控制台 UI
      - "18719:8719"   # 客户端心跳/规则下发通道
    entrypoint:
      - java
      - -Djava.security.egd=file:/dev/./urandom
      - -Dserver.port=8858
      - -Dcsp.sentinel.api.port=8719
      - -Dcsp.sentinel.dashboard.server=localhost:8858
      - -Dproject.name=sentinel-dashboard
      - -Dauth.enabled=false
      - -jar
      - app.jar
    networks: [exam-net]
    restart: unless-stopped

  # ==================== RocketMQ ====================
  rmqnamesrv:
    image: apache/rocketmq:5.3.2
    container_name: rmqnamesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"    # NameServer：客户端查路由
    environment:
      - JAVA_OPT_EXT=-server -Xms256m -Xmx512m -Xmn128m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/9876'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [exam-net]
    restart: unless-stopped

  rmqbroker:
    image: apache/rocketmq:5.3.2
    container_name: rmqbroker
    depends_on:
      - rmqnamesrv
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    ports:
      - "10909:10909"  # VIP 通道
      - "10911:10911"  # 消息收发主端口
      - "10912:10912"  # HA 端口
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      - JAVA_OPT_EXT=-server -Xms512m -Xmx1g -Xmn256m
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
      - ./rocketmq/store:/home/rocketmq/store      # 消息存储：重启不丢
      - ./rocketmq/logs:/home/rocketmq/logs
    networks: [exam-net]
    restart: unless-stopped

  # ==================== 数据存储层 ====================
  # 初始化挂载：官方 MySQL 镜像首次启动按文件名字母序执行
  # /docker-entrypoint-initdb.d/ 下的 *.sql。以 01-/02- 前缀保证「先建表、后灌数据」。
  # schema.sql 会自建 exam_auth_db 与 exam_core_db 两个库。
  mysql:
    image: mysql:8.0.31
    container_name: exam-mysql
    ports:
      - "13306:3306"   # 避开本机可能已装的 3306
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=exam_auth_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/init-data.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [exam-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: exam-redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [exam-net]
    restart: unless-stopped

  # ==================== 应用服务（镜像来自 GHCR） ====================
  # IMAGE_PREFIX 默认 ghcr.io/eny-o，一般无需修改。
  exam-auth-user:
    image: ${IMAGE_PREFIX:-ghcr.io/eny-o}/exam-auth-user:latest
    container_name: exam-auth-user
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_CONFIG_ENABLED=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [exam-net]
    restart: unless-stopped

  exam-core:
    image: ${IMAGE_PREFIX:-ghcr.io/eny-o}/exam-core:latest
    container_name: exam-core
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_CONFIG_ENABLED=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rmqnamesrv:
        condition: service_healthy
    networks: [exam-net]
    restart: unless-stopped

  exam-ai:
    image: ${IMAGE_PREFIX:-ghcr.io/eny-o}/exam-ai:latest
    container_name: exam-ai
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_CONFIG_ENABLED=false
      # AI 密钥从宿主 .env（或 shell 环境变量）注入；未提供时应用仍可启动
      - AI_API_KEY=${AI_API_KEY:-}
    depends_on:
      nacos:
        condition: service_healthy
    networks: [exam-net]
    restart: unless-stopped

  exam-gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/eny-o}/exam-gateway:latest
    container_name: exam-gateway
    ports:
      - "18080:8080"   # 对外暴露网关，便于直接调 API / 看 Knife4j 文档
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_CONFIG_ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      exam-auth-user:
        condition: service_started
      exam-core:
        condition: service_started
      exam-ai:
        condition: service_started
    networks: [exam-net]
    restart: unless-stopped

  exam-vue:
    image: ${IMAGE_PREFIX:-ghcr.io/eny-o}/exam-vue:latest
    container_name: exam-vue
    ports:
      - "8080:80"      # 用户访问入口
    depends_on:
      - exam-gateway
    networks: [exam-net]
    restart: unless-stopped

networks:
  exam-net:
    driver: bridge

volumes:
  mysql_data:
