server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 所有 /api 请求代理到网关（容器网络内通过服务名 gateway 可达）。
    # 注意：保留 /api 前缀，由网关的 StripPrefix=1 统一剥离，
    # 与开发期 vite 代理（target: http://localhost:8080，不剥离）行为一致。
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Knife4j 网关聚合文档前缀（可选，便于容器内调试接口文档）
    location ~ ^/(auth-user|exam-core|exam-ai)/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
