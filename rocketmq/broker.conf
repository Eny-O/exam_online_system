# RocketMQ Broker 配置（容器内）
#
# 由 docker-compose.yml 挂载到
#   /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
# 并通过 `sh mqbroker -c <该路径>` 显式指定，不依赖官方镜像 entrypoint 的隐式行为。
#
# 两点说明：
#   1. namesrvAddr 使用 compose 服务名 rmqnamesrv:9876
#   2. brokerIP1 是注册到 NameServer 的对外地址，宿主机与容器内客户端均需可解析

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 消息保留策略
deleteWhen = 04
fileReservedTime = 48

# 监听端口（容器内固定 10911，compose 映射到宿主 10911）
listenPort = 10911

# NameServer 地址
namesrvAddr = rmqnamesrv:9876

# broker 对外公布的地址
brokerIP1 = host.docker.internal

# 自动创建 Topic：项目的 exam-grade-topic 是发消息时按需创建的，
# 不开这个开关 producer 会报 "No route info of this topic"
autoCreateTopicEnable = true

# 存储路径
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
