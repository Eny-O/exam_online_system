# RocketMQ Broker 配置（本地开发用，容器内）
#
# 由 docker-compose.yml 挂载到
#   /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
# 并通过 `sh mqbroker -c <该路径>` 显式指定，不依赖官方镜像 entrypoint 的隐式行为。
#
# ⚠️ 两个必踩的坑（详见下方注释）：
#   1. namesrvAddr 必须是容器内的服务名 rmqnamesrv:9876，不能写 localhost
#      （broker 容器内的 localhost 指向它自己，不是 namesrv）
#   2. brokerIP1 必须是「宿主机侧客户端能连到的地址」
#      容器内自动探测到的是 172.x.x.x 容器 IP，宿主机上的 Java 客户端连不上；
#      这里填 127.0.0.1，靠端口映射 10911:10911 回到容器。
#      未来若把 Spring 应用也容器化，需改成 host.docker.internal 或宿主 LAN IP。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 消息保留策略
deleteWhen = 04
fileReservedTime = 48

# 监听端口（容器内固定 10911，compose 映射到宿主 10911）
listenPort = 10911

# 坑 1：容器内用 compose 服务名寻址 namesrv
namesrvAddr = rmqnamesrv:9876

# 坑 2：必须显式指定 broker 对外公布的地址
brokerIP1 = 127.0.0.1

# 自动创建 Topic：项目的 exam-grade-topic 是发消息时按需创建的，
# 不开这个开关 producer 会报 "No route info of this topic"
autoCreateTopicEnable = true

# 存储路径（对应 compose 中挂载的 rmq-store 卷，重启不丢消息）
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
