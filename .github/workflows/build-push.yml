name: Build and Push Images

# 触发：推送到 master/main 时自动构建并推送 5 个应用镜像到 GitHub Container Registry (GHCR)
on:
  push:
    branches: [master, main]
  workflow_dispatch:        # 允许在 Actions 页面手动触发

# GITHUB_TOKEN 默认无 packages 写权限，必须显式声明
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: eny-o        # 与 GitHub 账号（Eny-O）对应，GHCR 要求小写

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 用 Actions 自动注入的 GITHUB_TOKEN 登录 GHCR，无需任何外部密钥
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 后端服务（构建上下文为仓库根）----------
      - name: Build and push exam-auth-user
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.exam-auth-user
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/exam-auth-user:latest

      - name: Build and push exam-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.exam-core
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/exam-core:latest

      - name: Build and push exam-ai
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.exam-ai
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/exam-ai:latest

      - name: Build and push exam-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.exam-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/exam-gateway:latest

      # ---------- 前端（构建上下文为 exam-vue）----------
      - name: Build and push exam-vue
        uses: docker/build-push-action@v6
        with:
          context: ./exam-vue
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/exam-vue:latest
