spring:
  application:
    name: exam-auth-user
  datasource:
    url: jdbc:mysql://localhost:3306/exam_online_system_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000
  data:
    redis:
      host: localhost
      port: 6379
      database: 1

server:
  port: 8082
  tomcat:
    accept-count: 300
    threads:
      max: 300
      min-spare: 20

logging:
  level:
    org.springframework.security: WARN
    com.ai.exam_auth_user: DEBUG
  pattern:
    dateformat: HH:mm:ss

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      logic-delete-field: isDeleted
  type-aliases-package: com.ai.exam_auth_user.pojo.dos
  mapper-locations: classpath*:mapper/*.xml

springdoc:
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    swagger-model-name: 实体类列表

# ================== 内部接口调用方鉴权（开发阶段密钥写死，部署前请替换为强密钥） ==================
# 与 exam-spring 侧 exam.internal-api-key 必须保持一致；core 调 /inner/** 时通过 Feign 拦截器自动携带。
exam:
  internal-api-key: dev-inner-token-2026

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: exam-auth-user
  endpoint:
    prometheus:
      enabled: true
