# Docker 容器化部署 profile（SPRING_PROFILES_ACTIVE=docker）
# 完整配置集：连接地址使用 compose 服务名，其余与本地 application.yml 一致。
spring:
  application:
    name: exam-auth-user
  cloud:
    openfeign:
      client:
        config:
          exam-core:
            connectTimeout: 2000
            readTimeout: 5000
  datasource:
    url: jdbc:mysql://mysql:3306/exam_auth_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000
  data:
    redis:
      host: redis
      port: 6379
      database: 1

server:
  port: 8082
  tomcat:
    accept-count: 300
    threads:
      max: 300
      min-spare: 20

logging:
  level:
    org.springframework.security: WARN
    com.ai.exam_auth_user: DEBUG
  pattern:
    dateformat: HH:mm:ss

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      logic-delete-field: isDeleted
  type-aliases-package: com.ai.exam_auth_user.pojo.dos
  mapper-locations: classpath*:mapper/*.xml

springdoc:
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    swagger-model-name: 实体类列表

exam:
  # 内部接口调用方鉴权密钥
  internal-api-key: dev-inner-token-2026

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: exam-auth-user
  endpoint:
    prometheus:
      enabled: true
