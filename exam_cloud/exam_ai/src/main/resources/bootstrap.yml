# Spring Cloud Bootstrap 配置：Nacos 注册中心 / Sentinel 接入
# 注意：Spring Boot 3 默认不加载 bootstrap.yml，
#      需引入 spring-cloud-starter-bootstrap 才会生效（见 pom.xml）
spring:
  application:
    name: exam-ai
  cloud:
    nacos:
      # Docker 中 Nacos 映射：宿主 18848 -> 容器 8848
      # 客户端 gRPC 端口 = HTTP 端口 + 1000 = 19848（容器内 9848），已由客户端自动推导
      server-addr: 127.0.0.1:18848
      username: nacos
      password: nacos
      discovery:
        namespace: public
        group: DEFAULT_GROUP
        # 显式注册 IP：本项目微服务均为宿主 jar 同机部署，钉死 127.0.0.1 避免 InetUtils 误选
        # Docker/WSL 虚拟网卡（如 10.195.149.52），否则网关经 Nacos 拿到不可达 IP 会 NoRouteToHost。
        # 注意：若将来微服务进 Docker 容器，需改为 host.docker.internal 或宿主 LAN IP。
        ip: 127.0.0.1
        # 单机模式未开鉴权，auth 已在 compose 中关闭

    # Sentinel 流控熔断客户端
    # Dashboard 容器：UI/主端口 宿主 18858 -> 容器 8858。
    # 客户端必须连 Dashboard 的【主端口】（新协议的 /registry/machine、/app/heartbeat）。
    sentinel:
      transport:
        dashboard: 127.0.0.1:18858
        # 客户端自身监听端口；8719 不在 Windows 保留端口段(8798-9197)内
        port: 8719
      # 启动即初始化 Sentinel，不等首个请求触发
      eager: true
