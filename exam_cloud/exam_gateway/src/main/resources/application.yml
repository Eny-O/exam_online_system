server:
  port: 8080

spring:
  application:
    name: exam-gateway
  cloud:
    gateway:
      # 关闭"服务自动路由"（它会为每个注册服务自动生成一条路由），只用下面显式声明的路由
      discovery:
        locator:
          enabled: false
      routes:
        # 顺序关键：Spring Cloud Gateway 按顺序匹配，第一个命中即生效
        # /api/** 必须放在 /api/user/** 之后，否则会把 user 请求也吃掉
        - id: exam-auth-user
          uri: lb://exam-auth-user
          predicates:
            - Path=/api/user/**,/api/permission/**,/api/role/**,/api/sysClass/**
          filters:
            - StripPrefix=1
        # AI 批阅服务：必须放在 /api/** (exam-core) 之前，否则 /api/ai/** 会被 exam-core 路由吞掉
        - id: exam-ai
          uri: lb://exam_ai
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1
        - id: exam-core
          uri: lb://exam-core
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1
        # ---- Knife4j 聚合文档转发：把带前缀的路径转发到对应后端（StripPrefix=1 去掉前缀）----
        # 聚合文档的 url 用 /auth-user/...、/exam-core/...、/exam-ai/... 这种网关侧可达路径，
        # 由下面路由转发到各自后端，避免多个服务都暴露 /v3/api-docs 互相冲突。
        - id: exam-auth-user-doc
          uri: lb://exam-auth-user
          predicates:
            - Path=/auth-user/**
          filters:
            - StripPrefix=1
        - id: exam-core-doc
          uri: lb://exam-core
          predicates:
            - Path=/exam-core/**
          filters:
            - StripPrefix=1
        - id: exam-ai-doc
          uri: lb://exam_ai
          predicates:
            - Path=/exam-ai/**
          filters:
            - StripPrefix=1

      # 网关级 CORS（后端 CorsConfig 是 MVC 的，两套机制，互不冲突）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      httpclient:
        # 后端慢接口的响应超时（默认 0 = 不超时，实践上建议显式设）
        response-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      # 打开后可访问 /actuator/gateway/routes 查看生效的路由
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO

# ================== Knife4j 网关聚合文档 ==================
# 启用后访问 http://localhost:8080/doc.html，在「文档管理 -> 聚合文档」下拉切换微服务。
# 聚合文档由「网关路由 + 前缀路径」转发到后端：前端请求 /auth-user/v3/api-docs、/exam-core/v3/api-docs、/exam-ai/v3/api-docs，
# 网关 StripPrefix=1 转发为对应后端 /v3/api-docs（与 Controller 路径无冲突）。
# 后端需鉴权的接口，请在页面「全局参数设置」加 Authorization: Bearer <token>。
knife4j:
  gateway:
    enabled: true
    routes:
      # 这里的 url 必须是「网关侧可达、且能区分服务」的路径，不是后端内部路径。
      # 前端拿到 url 后请求 http://网关/auth-user/v3/api-docs 等，网关路由 StripPrefix=1 转发为对应后端 /v3/api-docs。
      # serviceName 在 4.4.0 的 routes 模式不参与路由（OpenAPI2Resource 不读取它），仅为语义标注。
      - name: 用户与权限服务
        serviceName: exam-auth-user
        url: /auth-user/v3/api-docs
        # contextPath: 调试请求时拼到接口 path 前的上下文路径。
        # 后端 Controller 是裸路径(/user/login)，网关靠 /api 前缀路由并 StripPrefix=1 去掉，
        # 所以这里填 /api，调试请求变为 http://网关/api/user/login 才能命中网关路由。
        contextPath: /api
        order: 1
      - name: 考试核心服务
        serviceName: exam-core
        url: /exam-core/v3/api-docs
        contextPath: /api
        order: 2
      - name: AI 批阅服务
        serviceName: exam_ai
        url: /exam-ai/v3/api-docs
        contextPath: /api
        order: 3
