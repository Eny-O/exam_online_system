server:
  port: 8080

spring:
  application:
    name: exam-gateway
  cloud:
    gateway:
      # 关闭"服务自动路由"（它会为每个注册服务自动生成一条路由），只用下面显式声明的路由
      discovery:
        locator:
          enabled: false
      routes:
        # 顺序关键：Spring Cloud Gateway 按顺序匹配，第一个命中即生效
        # /api/** 必须放在 /api/user/** 之后，否则会把 user 请求也吃掉
        - id: exam-auth-user
          uri: lb://exam-auth-user
          predicates:
            - Path=/api/user/**,/api/permission/**,/api/role/**
          filters:
            - StripPrefix=1
        - id: exam-spring
          uri: lb://exam-spring
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1

      # 网关级 CORS（后端 CorsConfig 是 MVC 的，两套机制，互不冲突）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      httpclient:
        # 后端慢接口的响应超时（默认 0 = 不超时，实践上建议显式设）
        response-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      # 打开后可访问 /actuator/gateway/routes 查看生效的路由
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
